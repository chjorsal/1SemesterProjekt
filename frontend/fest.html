<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fest</title>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <div class="page">
      <div class="leftside">
        <div class="now-playing">
          <div class="now-playing-top"><span>Now playing</span></div>
          <div class="now-playing-mid">Pokerface - Lady Gaga</div>
          <div class="now-playing-bottom">Artist</div>
        </div>

        <div class="qr-kode">
          <div class="info-left">
            <div class="info-top">
              <span>■ Next song</span>
            </div>
            <br />
            <div class="info-middle">
              <span>■ Top of next round</span>
            </div>
            <br />
            <div class="info-bottom">
              <span>■ Will be replaced</span>
            </div>
          </div>
        </div>
      </div>
      <!--Lukke div til leftside-->

      <div class="rightside">
        <div class="songlist">
          <div class="next-track">
            <div class="song-row green-song keep-song">
              <div class="song-info">
                <div class="song-title">Beat It</div>
                <div class="song-artist">Michael Jackson</div>
              </div>

              <div class="vote-box-next-track">
                <button class="vote-button" onclick="vote(this)">Stem</button>
                <span class="vote-count">0</span>
              </div>
            </div>
          </div>

          <div class="song-row keep-song">
            <div class="song-info">
              <div class="song-title keep-song-title">Beat it</div>
              <div class="song-artist keep-song-artist">Michael Jackson</div>
            </div>

            <div class="vote-box keep-vote-box">
              <button class="vote-button" onclick="vote(this)">Stem</button>
              <span class="vote-count">0</span>
            </div>
          </div>

          <div class="song-row kick-song-row">
            <div class="song-info">
              <div class="song-title">Beat It</div>
              <div class="song-artist">Michael Jackson</div>
            </div>

            <div class="vote-box">
              <button class="vote-button" onclick="vote(this)">Stem</button>
              <span class="vote-count">0</span>
            </div>
          </div>

          <div class="song-row kick-song-row">
            <div class="song-info">
              <div class="song-title">Beat It</div>
              <div class="song-artist">Michael Jackson</div>
            </div>

            <div class="vote-box">
              <button class="vote-button" onclick="vote(this)">Stem</button>
              <span class="vote-count">0</span>
            </div>
          </div>

          <div class="song-row kick-song-row">
            <div class="song-info">
              <div class="song-title">Beat It</div>
              <div class="song-artist">Michael Jackson</div>
            </div>

            <div class="vote-box">
              <button class="vote-button" onclick="vote(this)">Stem</button>
              <span class="vote-count">0</span>
            </div>
          </div>
        </div>
        <!--Lukke div til songlist-->
      </div>
      <!--Lukke div til rightside-->
    </div>
    <!--Lukke div til page-->

    <div>
      <a href="mood.html">
        <button id="buttomFrontPage" class="btn">Mood</button>
      </a>
    </div>
    <script src="fest.js" type="module"></script>
    <script src="votes.js" type="module"></script>
  </body>
</html>
