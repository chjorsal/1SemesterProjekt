<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <div class="join2-page">
      <div class="join2-container">
        <div class="join2-header">Vælg dit brugernavn</div>
        <div id="stepName">
          <input type="text" id="nameInput" placeholder="Skriv dit navn..." />
          <button id="createUserBtn" class="btn">Opret bruger</button>
          <p id="nameError"></p>
        </div>

        <div class="join2-header">Join en session</div>

        <div id="joinSession">
          <input
            type="number"
            id="sessionInput"
            placeholder="Indtast session ID..."
          />

          <button id="confirmJoinBtn" class="btn">Join session</button>
        </div>

        <p id="sessionError"></p>

        <script src="join.js"></script>
      </div>
    </div>
  </body>
</html>
